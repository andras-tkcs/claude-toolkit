# .claude/toolkit.yaml — the project profile read by the devflow commands (/make-plan, /implement, /dod).
# Every command checks this file first and stops, naming the key, if a required key is missing.
# An optional key you leave out means "this project does not use that".
# Reference: docs/profile-reference.md in https://github.com/andras-tkcs/claude-toolkit

toolkit:
  ref: v0.1.0            # needed only for the SessionStart-hook delivery route: the toolkit tag to install

project:
  name: My Project       # optional; used in prose. Default: the repository name

docs:
  must_read:             # REQUIRED (may be []). Planner, workers and the final reviewer read these first.
    - README.md
  plan_dir: docs/        # optional, default docs/. Plan documents are <plan_dir>/<slug>-plan.md
  # adr_dir: docs/adr    # optional. Set it and the commands use ADRs; leave it out and they never mention them
  # adr_index: docs/adr/README.md
  # adr_bar: CONTRIBUTING.md#decisions-and-adrs   # where "this needs an ADR" is defined
  # changelog:                                    # optional. Leave out if the project keeps no changelog
  #   file: CHANGELOG.md
  #   section: "## [Unreleased]"

git:
  main_branch: main            # REQUIRED
  branch_pattern: "<type>/<kebab-case>"   # REQUIRED. Quoted into worker prompts
  # branch_types: [feature, fix, chore]   # optional. /implement checks the manifest's feature_branch against it
  # merge_style: merge-commit             # optional: merge-commit | squash

verify:
  fast:                  # REQUIRED. Run after every merge in /implement. Keep it to seconds-to-a-minute.
    - echo "replace with your lint + quick tests"
  dod:                   # REQUIRED. The blocking definition-of-done gate /dod runs, in order.
    - echo "replace with your full gate"
    # A command can also be a mapping:
    # - run: pytest -v --cov
    #   narrow: "pytest -v {args}"     # used when /dod is given arguments (a partial run)
    # - run: python3 scripts/check_floor.py
    #   skip_when_narrowed: true       # reported as n/a (partial run) on a partial run
    # - run: npm test
    #   cwd: web                       # relative to the repo root
  # dod_conditional:       # optional. Rows that apply only when the diff touches matching files
  #   - when: ["src/db/**", "migrations/**"]
  #     do: "Run the migration check: scripts/check_migrations.sh"
  # dod_manual:            # optional. Judgement rows: reported ok / needs attention / n/a, never PASS
  #   - "A user-visible change has a changelog line."
  # dod_doc: docs/contributing.md#definition-of-done   # optional pointer, quoted in the report

# ci:
#   dispatchable:          # optional. Workflows a session may dispatch against its own branch for
#     - workflow: macos-tests.yml        # work the cloud container cannot do. One line each.
#       use_when: "Build or test an iOS/macOS target (xcodebuild, simulators)"
#       notes: "No inputs."              # optional

stacks: []               # REQUIRED (may be []). Stack skills to load: [python], [swift], ...

# models:                # optional. Defaults shown.
#   planner: opus
#   orchestrator: sonnet
#   worker: sonnet
#   reviewer: opus

# project_steward: .claude/skills/steward/SKILL.md   # optional: project skill with policy that fits no key above
